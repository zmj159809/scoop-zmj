name: Excavator

on:
  schedule:
    # UTC: every four hours at minute 20 (Beijing: 00:20, 04:20, ...).
    - cron: '20 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: excavator-${{ github.ref }}
  cancel-in-progress: false

jobs:
  excavate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Check manifest basics
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Update manifests and push
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: '1'
          THROW_ERROR: '1'
      # Commits made with GITHUB_TOKEN do not trigger the push validation workflow.
      - name: Check updated manifests
        shell: pwsh
        run: ./scripts/validate.ps1
